name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Siapkan file APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TeleponWA.apk

      - name: Terbitkan ke Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" TeleponWA.apk \
            --target "${{ github.sha }}" \
            --title "Telepon WA versi 1.0.${{ github.run_number }}" \
            --notes "Unduh file TeleponWA.apk di bawah, lalu pasang di HP." \
            --latest
